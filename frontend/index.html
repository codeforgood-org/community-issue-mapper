<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Report and track community issues in your area">
    <meta name="theme-color" content="#2563eb">
    <title>Community Issue Mapper</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-map-marked-alt"></i> Community Issue Mapper</h1>
                <p>Report and track community issues in your area</p>
            </div>
            <div class="header-stats" id="stats">
                <div class="stat-item">
                    <span class="stat-number" id="total-issues">0</span>
                    <span class="stat-label">Total Issues</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="new-issues">0</span>
                    <span class="stat-label">New</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="resolved-issues">0</span>
                    <span class="stat-label">Resolved</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h2><i class="fas fa-plus-circle"></i> Report Issue</h2>
                    <p class="help-text">Click on the map to select a location</p>

                    <form id="issue-form" class="issue-form">
                        <div class="form-group">
                            <label for="title">Title *</label>
                            <input type="text" id="title" name="title" required placeholder="Brief description">
                        </div>

                        <div class="form-group">
                            <label for="category">Category *</label>
                            <select id="category" name="category" required>
                                <option value="">Select category</option>
                                <option value="pothole">🕳️ Pothole</option>
                                <option value="accessibility">♿ Accessibility</option>
                                <option value="streetlight">💡 Streetlight</option>
                                <option value="graffiti">🎨 Graffiti</option>
                                <option value="trash">🗑️ Trash/Litter</option>
                                <option value="other">📋 Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="description">Description *</label>
                            <textarea id="description" name="description" required rows="4" placeholder="Detailed description of the issue"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="reporter-name">Your Name</label>
                            <input type="text" id="reporter-name" name="reporter_name" placeholder="Optional">
                        </div>

                        <div class="form-group">
                            <label for="reporter-email">Your Email</label>
                            <input type="email" id="reporter-email" name="reporter_email" placeholder="Optional">
                        </div>

                        <div class="form-group">
                            <label for="image">Photo</label>
                            <input type="file" id="image" name="image" accept="image/*">
                            <small class="help-text">Max 10MB</small>
                        </div>

                        <div id="selected-location" class="selected-location" style="display: none;">
                            <i class="fas fa-map-pin"></i>
                            <span id="location-text">Location selected</span>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            <i class="fas fa-paper-plane"></i> Submit Issue
                        </button>
                    </form>
                </div>

                <!-- Filters -->
                <div class="sidebar-section">
                    <h2><i class="fas fa-filter"></i> Filters</h2>

                    <div class="form-group">
                        <label for="filter-category">Category</label>
                        <select id="filter-category">
                            <option value="">All Categories</option>
                            <option value="pothole">Pothole</option>
                            <option value="accessibility">Accessibility</option>
                            <option value="streetlight">Streetlight</option>
                            <option value="graffiti">Graffiti</option>
                            <option value="trash">Trash/Litter</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filter-status">Status</label>
                        <select id="filter-status">
                            <option value="">All Statuses</option>
                            <option value="new">New</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>

                    <button class="btn btn-secondary" id="apply-filters">
                        <i class="fas fa-check"></i> Apply Filters
                    </button>
                    <button class="btn btn-secondary" id="reset-filters">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                </div>

                <!-- Legend -->
                <div class="sidebar-section legend">
                    <h3><i class="fas fa-info-circle"></i> Map Legend</h3>
                    <div class="legend-item">
                        <span class="legend-marker marker-new"></span>
                        <span>New Issue</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-marker marker-in-progress"></span>
                        <span>In Progress</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-marker marker-resolved"></span>
                        <span>Resolved</span>
                    </div>
                </div>
            </aside>

            <!-- Map Container -->
            <main class="map-container">
                <div id="map"></div>
                <div class="map-controls">
                    <button class="btn btn-icon" id="refresh-btn" title="Refresh Issues">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn btn-icon" id="locate-btn" title="Find My Location">
                        <i class="fas fa-location-arrow"></i>
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Custom JS -->
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
