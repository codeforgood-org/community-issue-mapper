version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: community-issues-db
    environment:
      POSTGRES_USER: issueapp
      POSTGRES_PASSWORD: issueapp_password
      POSTGRES_DB: community_issues
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build: .
    container_name: community-issues-app
    environment:
      - PORT=8080
      - ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=issueapp
      - DB_PASSWORD=issueapp_password
      - DB_NAME=community_issues
      - DB_SSL_MODE=disable
      - CORS_ALLOWED_ORIGINS=*
      - MAX_UPLOAD_SIZE=10485760
      - UPLOAD_DIR=./uploads
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_DURATION=1m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/root/uploads
    restart: unless-stopped
    networks:
      - app-network

  # Database migration service
  migrate:
    image: migrate/migrate
    container_name: community-issues-migrate
    volumes:
      - ./backend/migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://issueapp:issueapp_password@postgres:5432/community_issues?sslmode=disable",
      "up"
    ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
